# Keep GitHub Actions pinned to current major versions.
# See https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
