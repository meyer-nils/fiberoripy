# Build the distribution on every release tag and publish it to PyPI.
# Publishing uses PyPI Trusted Publishing (OIDC), so no API token is stored here.
name: Publish to PyPI

on:
  push:
    tags: [ 'v*' ]
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install build frontend
      run: python -m pip install --upgrade build
    - name: Build a binary wheel and a source tarball
      run: python -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  publish:
    name: Publish Python 🐍 distributions 📦 to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fiberoripy
    permissions:
      # Required for Trusted Publishing; scoped to this job only.
      id-token: write
    steps:
    - name: Download the distribution packages
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
