# Install the package and run the test suite on all supported Python versions.
name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install fiberoripy
      # Editable, so that the tests import the same files coverage measures.
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test]"
    - name: Test with pytest
      run: pytest --cov --cov-report=term-missing --cov-fail-under=95
    - name: Coverage summary
      if: always() && matrix.python-version == '3.13'
      run: |
        echo "### Coverage: $(coverage report --format=total)%" >> $GITHUB_STEP_SUMMARY
        coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
