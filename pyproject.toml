[project]
name = "fiberoripy"
version = "1.3.0"
description = "Fiber orientation models and closures"
authors = [
    { name = "Nils Meyer", email = "nils.meyer@uni-a.de" },
    { name = "Constantin Krauß" },
    { name = "Louis Schreyer" },
    { name = "Julian Karl Bauer" },
    { name = "Johannes Mitsch" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "fiber orientation",
    "orientation tensor",
    "closure approximation",
    "fiber suspension",
    "composites",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
# Lower bounds are the oldest releases that provide Python 3.11 wheels.
dependencies = [
    "numpy>=1.23.3",
    "scipy>=1.9.2",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=7"]
examples = ["ipympl>=0.9", "jupyter"]
docs = ["zensical>=0.0.62", "mkdocs", "mkdocstrings-python>=2", "nbconvert>=7", "ipykernel"]

[project.urls]
homepage = "https://github.com/meyer-nils/fiberoripy"
documentation = "https://meyer-nils.github.io/fiberoripy"
repository = "https://github.com/meyer-nils/fiberoripy"
issues = "https://github.com/meyer-nils/fiberoripy/issues"

[project.scripts]
fiberoripy = "fiberoripy.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fiberoripy"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# pycodestyle, pyflakes, isort and pydocstyle; E/F/W keep the previous flake8 checks.
select = ["E", "F", "W", "I", "D"]
# Module- and package-level docstrings are not required.
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
